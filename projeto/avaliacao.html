<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enigma Clube - Avaliação Enviada</title>
  <meta name="description" content="Confirmação de envio da avaliação de produto no Enigma Clube.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <header>
    <h1>🔎 Enigma Clube</h1>

      <p><a href="formulario.html">&larr; Avaliar outro produto</a></p>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Enigma Clube — Projeto WDD 131</p>
  </footer>

  <script src="roteiros/avaliacao.js" defer></script>
